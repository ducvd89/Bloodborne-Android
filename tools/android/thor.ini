# Android default settings (bbport.default.ini). The app applies them on a first install and once
# when updating from before 0.8.0 (settings_defaults in SettingsDefaults.java); later updates keep
# the player's settings. Display: aspect ratio auto (the screen's own), output 1080p (1080 lines, the width follows the aspect ratio),
# FSR 3.1 Performance (scene = output / 2), 60 FPS limit with real-time game speed down to 20 FPS.
# Formerly tuned on the AYN Thor (Adreno 740): 752x424 scene upscaled by FSR 3.1 to
# 1280x720, the costly effects off and the lowest model detail (the GPU time is mostly geometry),
# ~34 FPS in Central Yharnam. Lossless Scaling and the cheats start off.
upscaler=fsr3
preset=3
output_res=1920x1080
aspect_ratio=auto
live_resolution=0
sharpen=1
sharpness=0.60
object_motion=0
show_fps=1
effect_chromatic_aberration=0
effect_dof=0
effect_motion_blur=0
effect_ssao=0
effect_game_aa=0
effect_dynamic_shadows=0
effect_ssr=0
skip_intro=1
debug_camera=0
debug_menu=0
mouse_look=0
jitter=1
reactive=0
reactive_scale=1.00
reactive_threshold=0.20
reactive_max=0.90
debug_view=0
fsr4_auto_exposure=1
fsr4_invert_jitter=0
model_lod=2
fps_limit=60
# Keep the game at real-time speed when the frame rate drops, down to 20 FPS (30: slow motion below 30 FPS).
speed_floor=20
thor_cpus=
frame_generation=0
lsfg_multiplier=0
lsfg_flow_scale=0.75
lsfg_performance=1
lsfg_fp16=1
vsync=0
cheat_health=0
cheat_items=0
# auto: the GPU driver bundled in the app for this phone's GPU (the app installs it); system: the phone's own.
gpu_driver=auto

# SDL names describe positions; the Thor's printed labels are Nintendo style.
pad.cross=a
pad.circle=b
pad.square=x
pad.triangle=y
pad.l1=leftshoulder
pad.r1=rightshoulder
pad.l2=lefttrigger
pad.r2=righttrigger
pad.l3=leftstick
pad.r3=rightstick
pad.options=start
pad.touchpad=back
pad.up=dpup
pad.down=dpdown
pad.left=dpleft
pad.right=dpright
