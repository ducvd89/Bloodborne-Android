# Experimental AYN Thor boot profile; independent of the desktop installation.
upscaler=fsr3
preset=3
output_res=1280x720
live_resolution=0
sharpen=0
sharpness=0.50
object_motion=0
show_fps=1
effect_chromatic_aberration=0
effect_dof=0
effect_motion_blur=0
effect_ssao=0
effect_game_aa=1
effect_dynamic_shadows=1
effect_ssr=0
skip_intro=1
debug_camera=0
debug_menu=0
mouse_look=0

# SDL names describe positions; the Thor's printed labels are Nintendo style.
pad.cross=a
pad.circle=b
pad.square=x
pad.triangle=y
pad.l1=leftshoulder
pad.r1=rightshoulder
pad.l2=lefttrigger
pad.r2=righttrigger
pad.l3=leftstick
pad.r3=rightstick
pad.options=start
pad.touchpad=back
pad.up=dpup
pad.down=dpdown
pad.left=dpleft
pad.right=dpright
